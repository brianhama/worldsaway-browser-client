name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run tcl:setup
      - run: npm run release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: source-node-${{ matrix.node }}
          path: release/*.tar.gz
